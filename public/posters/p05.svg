<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1270" width="900" height="1270"><rect x="0" y="0" width="900" height="1270" fill="#E8E4DA" /><rect x="0" y="0" width="900" height="120" fill="#0E0E0E" /><text x="30" y="78" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#E8E4DA" opacity="1" text-anchor="start">社团招新 · 每年只招一次</text><rect x="0" y="150" width="900" height="300" fill="#FF5A1F" /><text x="40" y="300" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="120" font-weight="900" letter-spacing="0" fill="#0E0E0E" opacity="1" text-anchor="start">我们要</text><text x="40" y="430" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="150" font-weight="900" letter-spacing="0" fill="#0E0E0E" opacity="1" text-anchor="start">你</text><text x="40" y="540" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="64" font-weight="900" letter-spacing="2" fill="#0E0E0E" opacity="1" text-anchor="start">独立音乐社</text><text x="44" y="610" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" letter-spacing="0" fill="#0E0E0E" opacity="1" text-anchor="start">排歌、排练、上台。每周一次在旧礼堂地下室，</text><text x="44" y="650" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" letter-spacing="0" fill="#0E0E0E" opacity="1" text-anchor="start">会什么乐器都行，不会也行。</text><rect x="0" y="700" width="900" height="6" fill="#0E0E0E" /><text x="44" y="790" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="52" font-weight="900" letter-spacing="0" fill="#0E0E0E" opacity="1" text-anchor="start">每周六 14:00–17:30</text><text x="44" y="842" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" letter-spacing="0" fill="#0E0E0E" opacity="1" text-anchor="start">首次见面：10月31日