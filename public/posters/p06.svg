<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1270" width="900" height="1270"><rect x="0" y="0" width="900" height="1270" fill="#FCFCFA" /><circle cx="660" cy="300" r="168" fill="#C7D6C0" opacity="0.55"/><circle cx="700" cy="340" r="96" fill="#9fb69a" opacity="0.35"/><text x="96" y="132" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="500" letter-spacing="4" fill="#6c6c6c" opacity="1" text-anchor="start">摄影系 2024 级 期末呈现</text><text x="92" y="268" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="104" font-weight="400" letter-spacing="0" fill="#1A1A1A" opacity="1" text-anchor="start">空的</text><text x="92" y="380" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="104" font-weight="400" letter-spacing="0" fill="#1A1A1A" opacity="1" text-anchor="start">房间</text><text x="96" y="432" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="500" letter-spacing="6" fill="#8a8a8a" opacity="1" text-anchor="start">THE EMPTY ROOM</text><line x1="96" y1="500" x2="340" y2="500" stroke="#1A1A1A" stroke-width="1" /><text x="96" y="556" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="24" font-weight="400" letter-spacing="0" fill="#3f3f3f" opacity="1" text-anchor="start">十四位同学，把镜头对准没人待的房间。</text><text x="96" y="594" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="24" font-weight="400" letter-spacing="0" fill="#3f3f3f" opacity="1" text-anchor="start">空教室、空宿舍、走廊尽头。</text><text x="96" y="730" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="34" font-weight="500" letter-spacing="0" fill="#1A1A1A" opacity="1" text-anchor="start">11月8日 周六</text><text x="96" y="772" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" letter-spacing="0" fill="#5c5c5c" opacity="1" text-anchor="start">14:00 开幕 · 展至 11月22日</text><text x="96" y="862" font-family=