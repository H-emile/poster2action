<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1270" width="900" height="1270"><rect x="0" y="0" width="900" height="1270" fill="#16302A" /><rect x="44" y="44" width="812" height="1182" fill="none" stroke="#C9A227" stroke-width="1.5" opacity="0.7"/><rect x="58" y="58" width="784" height="1154" fill="none" stroke="#C9A227" stroke-width="0.8" opacity="0.4"/><text x="90" y="150" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="21" font-weight="600" letter-spacing="3" fill="#C9A227" opacity="1" text-anchor="start">文学院 · 中国思想史系列讲座 第 4 讲</text><text x="88" y="300" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="110" font-weight="600" letter-spacing="6" fill="#F2EAD8" opacity="1" text-anchor="start">笔记</text><text x="88" y="420" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="110" font-weight="600" letter-spacing="6" fill="#F2EAD8" opacity="1" text-anchor="start">作为方法</text><text x="90" y="476" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="500" letter-spacing="7" fill="#C9A227" opacity="1" text-anchor="start">NOTES AS METHOD</text><line x1="90" y1="540" x2="400" y2="540" stroke="#C9A227" stroke-width="1" /><text x="90" y="600" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="25" font-weight="400" letter-spacing="0" fill="#d9d0bd" opacity="1" text-anchor="start">从宋人读书札记到今天的手机备忘录，</text><text x="90" y="642" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="25" font-weight="400" letter-spacing="0" fill="#d9d0bd" opacity="1" text-anchor="start">我们为什么总觉得“记下来”就算读过了。</text><text x="90" y="760" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="30" font-weight="600" letter-spacing="0" fill="#F2EAD8" opacity="1" text-anchor="start">2026年11月21日（周六）</text><text x="90" y="802" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" letter-spacing="0" fill="#bfb6a